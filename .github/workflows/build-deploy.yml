name: Build and Deploy

on:
  push:
    branches:
      - main
      # - dev

jobs:
  build:
    if: ${{ github.repository_owner == 'johnarban' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.5.3

      - name: Yarn install
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          VUE_APP_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VUE_APP_CDS_API_KEY: ${{ secrets.CDS_API_KEY }}


      - name: Check for draft flag
        uses: sergeysova/jq-action@v2
        id: draft
        with:
          cmd: cat package.json | jq -r '.draft // false'



      - name: Set up deployment folder
        run: |
          mv dist deployment

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ steps.draft.outputs.value == 'false' }}
        with:
          branch: gh-pages
          folder: deployment
          token: ${{ secrets.GITHUB_TOKEN }}
